MT_ENGINE_DEEPSEEK=DeepSeek
MT_ENGINE_DEEPSEEK_API_KEY_LABEL=DeepSeek API key
MT_ENGINE_DEEPSEEK_MODEL_LABEL=Model
MT_ENGINE_DEEPSEEK_REASONING_LABEL=Reasoning
MT_ENGINE_DEEPSEEK_REASONING_FASTER=Faster
MT_ENGINE_DEEPSEEK_REASONING_SMARTER=Smarter
MT_ENGINE_DEEPSEEK_TEMPERATURE_LABEL=Temperature
MT_ENGINE_DEEPSEEK_DYNAMIC_TEMPERATURE_LABEL=Dynamic Temperature
MT_ENGINE_DEEPSEEK_GLOSSARY_MODE_LABEL=Glossary
MT_ENGINE_DEEPSEEK_GLOSSARY_MODE_NONE=None
MT_ENGINE_DEEPSEEK_GLOSSARY_MODE_REFERENCE=Reference (override only to avoid errors)
MT_ENGINE_DEEPSEEK_GLOSSARY_MODE_STRICT=Strict (always follow)
MT_ENGINE_DEEPSEEK_CONTEXT_LABEL=Context segments (above/below)
MT_ENGINE_DEEPSEEK_CONTEXT_TRUNCATION_LABEL=Context character limit
MT_ENGINE_DEEPSEEK_CONTEXT_TRUNCATION_NOLIMIT=No limit
MT_ENGINE_DEEPSEEK_CHAINING_LABEL=Context chaining (ordered previous segments)
MT_ENGINE_DEEPSEEK_CHAINING_TOOLTIP=Builds an ordered chain of previous segments (seg 1, 2, 3...) into every prompt.\nA segment joins the chain only after its translation is stored in the project\n(i.e. after your edits — never the raw AI reply), and only in order:\nthe chain never extends across an untranslated gap.\nAppend-only growth keeps the prompt prefix stable for DeepSeek's context cache.\nReplaces the [Above] context format; segments below still follow Context segments.
MT_ENGINE_DEEPSEEK_CHAIN_LENGTH_LABEL=Chain length (max previous segments)
MT_ENGINE_DEEPSEEK_API_KEY_NOTFOUND=DeepSeek API key not found.
MT_ENGINE_DEEPSEEK_BAD_RESPONSE=DeepSeek returned an unexpected response.
MT_ENGINE_DEEPSEEK_AUTO_INSERT_LABEL=Auto-insert translation into target field
MT_ENGINE_DEEPSEEK_AUTO_INSERT_TOOLTIP=When auto-mode is active (Ctrl+Shift+M), automatically fills the target segment with the machine translation result.\nEliminates the need to press Ctrl+M for each segment.
MT_ENGINE_DEEPSEEK_AUTO_HELP_LABEL=Use Ctrl+Shift+M to toggle the auto function on or off. Enable Auto-insert or Auto-confirm below to use it.
MT_ENGINE_DEEPSEEK_AUTO_CONFIRM_LABEL=Auto-confirm and go to next segment
MT_ENGINE_DEEPSEEK_AUTO_CONFIRM_TOOLTIP=When auto-mode is active, also commits the translation and moves to the next untranslated segment.\nWARNING: No chance to review!\n\nUse Ctrl+Shift+M to toggle auto-mode on/off at any time without changing these settings.
MT_ENGINE_DEEPSEEK_AUTO_GLOSSARY_LABEL=Auto-glossary (AI-suggested terms)
MT_ENGINE_DEEPSEEK_AUTO_GLOSSARY_TOOLTIP=Asks the AI to suggest key terminology pairs alongside each translation.\nEntries (with optional usage comments) are saved to deepseek_auto_glossary.txt\nin the project's glossary folder. The AI decides which terms are worth adding.
MT_ENGINE_DEEPSEEK_SELF_REVIEW_LABEL=Self-review translation (agent)
MT_ENGINE_DEEPSEEK_SELF_REVIEW_TOOLTIP=Sends the translation back to the AI for a second-pass quality check.\nReviews: tag preservation, glossary consistency, accuracy, and fluency.\nCorrects errors automatically. Adds ~1 extra API call per segment.
MT_ENGINE_DEEPSEEK_MENU_LABEL=DeepSeek
MT_ENGINE_DEEPSEEK_MENU_RAW_LOG_TOGGLE=Log raw DeepSeek responses
MT_ENGINE_DEEPSEEK_MENU_RAW_LOG_TOGGLE_TOOLTIP=Appends every raw response body received from DeepSeek to deepseek_raw.log in the OmegaT configuration folder.\nThe file contains only raw DeepSeek responses — no timestamps or other noise.
MT_ENGINE_DEEPSEEK_MENU_RAW_LOG_OPEN=Open raw response log
MT_ENGINE_DEEPSEEK_MENU_RAW_LOG_CLEAR=Clear raw response log
MT_ENGINE_DEEPSEEK_RAW_LOG_NOT_FOUND=No raw response log yet — enable logging and translate a segment first.
MT_ENGINE_DEEPSEEK_MENU_PROMPTS=Current prompts
MT_ENGINE_DEEPSEEK_MENU_PROMPTS_TOOLTIP=Shows the most recent request sent to the DeepSeek API — parameters, system prompt, and user message with real line breaks.
MT_ENGINE_DEEPSEEK_MENU_CHAIN_CLEAR=Clear context chain
MT_ENGINE_DEEPSEEK_MENU_CHAIN_CLEAR_TOOLTIP=Empties the context chaining "Previous segments" chain. The next translation starts a new chain from the current segment.\nUse this after jumping to a different chapter or scene when you don't want the previous context.
MT_ENGINE_DEEPSEEK_MENU_CHAIN_CLEARED=DeepSeek context chain cleared
MT_ENGINE_DEEPSEEK_PROMPTS_NOT_FOUND=No request sent yet — translate a segment first.
MT_ENGINE_DEEPSEEK_TAGS_LABEL=Work tags (identify the novel to the AI)
MT_ENGINE_DEEPSEEK_TAGS_BUTTON=Additional tags...
MT_ENGINE_DEEPSEEK_TAGS_DIALOG_TITLE=Work tags
MT_ENGINE_DEEPSEEK_TAGS_AUTHOR=Source author
MT_ENGINE_DEEPSEEK_TAGS_TITLE=Source title
MT_ENGINE_DEEPSEEK_TAGS_TAGS=Source tags
MT_ENGINE_DEEPSEEK_TAGS_LABELS=Generic labels
MT_ENGINE_DEEPSEEK_TAGS_CUSTOM=Blank tags
MT_ENGINE_DEEPSEEK_TAGS_SAVE=Create / update tags
MT_ENGINE_DEEPSEEK_TAGS_CANCEL=Cancel
MT_ENGINE_DEEPSEEK_TAGS_SAVED=Work tags saved to deepseek_tags.txt in the project folder
MT_ENGINE_DEEPSEEK_TAGS_NO_PROJECT=No project is open. Work tags are stored inside the project folder, so open a project first.
MT_JSON_ERROR=Invalid JSON returned by the DeepSeek API.
